name: Playwright Tests

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  playwright:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        run: npx playwright test e2e/toolshop e2e/api --project=chromium --workers=1 --retries=0
        env:
          TOOLSHOP_EMAIL: ${{ secrets.TOOLSHOP_EMAIL }}
          TOOLSHOP_PASSWORD: ${{ secrets.TOOLSHOP_PASSWORD }}
          TOOLSHOP_NEGATIVE_EMAIL: ${{ secrets.TOOLSHOP_NEGATIVE_EMAIL }}

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: warn
